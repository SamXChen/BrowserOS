<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Chrome caches favicons per page URL, so replacing the bytes behind an
         already-used icon path does not update the tab. Keep this URL distinct
         from /icon/*.png, which the toolbar also uses. -->
    <link rel="icon" type="image/svg+xml" href="/icons/neob.svg" />
    <title>NEOB</title>
    <!-- Pre-applies the stored theme before React renders to avoid a
         theme flash. Must stay type="module": Vite extracts it into a
         chunk, which MV3's no-inline-script CSP requires. -->
    <script type="module">
      import { getStoredTheme, resolveTheme } from '@/lib/theme/theme-storage'

      const resolved = resolveTheme(getStoredTheme())
      document.documentElement.classList.remove('light', 'dark')
      document.documentElement.classList.add(resolved)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
