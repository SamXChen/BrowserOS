NetworkCaptureTab:
  type: object
  required: [tabId, pageId, title, url, attached]
  properties:
    tabId:
      type: integer
    pageId:
      type: integer
    title:
      type: string
    url:
      type: string
    attached:
      type: boolean

NetworkCaptureState:
  type: object
  required: [running, records, gapEvents]
  properties:
    running:
      type: boolean
    state:
      type: string
      enum: [running, paused, stopped]
    startedAt:
      type: integer
    records:
      type: integer
    gapEvents:
      type: integer
    bodyBytes:
      type: integer
    tabs:
      type: array
      items:
        $ref: '#/NetworkCaptureTab'

NetworkBrowserState:
  type: object
  required: [connected]
  properties:
    connected:
      type: boolean

NetworkRulesState:
  type: object
  required: [active, total]
  properties:
    active:
      type: integer
    total:
      type: integer

NetworkRuntimeState:
  type: object
  properties:
    paused:
      type: integer
    decisionP95Ms:
      type: integer
    rulesGeneration:
      type: integer
    processorP95Ms:
      type: integer
    processorInflight:
      type: integer

NetworkStatus:
  type: object
  required: [browser, capture, rules]
  properties:
    browser:
      $ref: '#/NetworkBrowserState'
    capture:
      $ref: '#/NetworkCaptureState'
    rules:
      $ref: '#/NetworkRulesState'
    runtime:
      $ref: '#/NetworkRuntimeState'

NetworkHeaderPair:
  type: object
  required: [name, value]
  properties:
    name:
      type: string
    value:
      type: string

NetworkMockMark:
  type: object
  required: [ruleId, revision, outcome]
  properties:
    ruleId:
      type: string
    revision:
      type: integer
    outcome:
      type: string
    reason:
      type: string

NetworkRecord:
  type: object
  required: [recordId, seq, requestId, method, url, startedAtMs, state, bodyState]
  properties:
    recordId:
      type: string
    seq:
      type: integer
    requestId:
      type: string
    redirectOrdinal:
      type: integer
    tabId:
      type: integer
    tabTitle:
      type: string
    pageId:
      type: integer
    frameId:
      type: string
    method:
      type: string
    url:
      type: string
    resourceType:
      type: string
    requestHeaders:
      type: array
      items:
        $ref: '#/NetworkHeaderPair'
    postData:
      type: string
    status:
      type: integer
    statusText:
      type: string
    mimeType:
      type: string
    responseHeaders:
      type: array
      items:
        $ref: '#/NetworkHeaderPair'
    encodedDataLength:
      type: integer
    startedAtMs:
      type: integer
    finishedAtMs:
      type: integer
    fromCache:
      type: boolean
    fromServiceWorker:
      type: boolean
    state:
      type: string
    failure:
      type: string
    bodyState:
      type: string
    bodyReason:
      type: string
    mock:
      $ref: '#/NetworkMockMark'

NetworkRecordList:
  type: object
  required: [records]
  properties:
    records:
      type: array
      items:
        $ref: '#/NetworkRecord'

NetworkBodyPage:
  type: object
  required: [encoding, offset, total, truncated, data]
  properties:
    encoding:
      type: string
    offset:
      type: integer
    length:
      type: integer
      description: Bytes in this window; set for rule and handoff samples.
    total:
      type: integer
    truncated:
      type: boolean
    data:
      type: string
    state:
      type: string
    mimeType:
      type: string

NetworkEmptyRequest:
  type: object

NetworkTabReloadRequest:
  type: object
  required: [ignoreCache]
  properties:
    ignoreCache:
      type: boolean

NetworkHandoffRequest:
  type: object
  required: [recordId]
  properties:
    recordId:
      type: string

NetworkHandoffCreated:
  type: object
  required: [handoffId, clipboardText, expiresAt, reused]
  properties:
    handoffId:
      type: string
    clipboardText:
      type: string
    expiresAt:
      type: integer
    reused:
      type: boolean

NetworkHandoffSummary:
  type: object
  required: [id, createdAt, expiresAt, state, bodyState]
  properties:
    id:
      type: string
    createdAt:
      type: integer
    expiresAt:
      type: integer
    state:
      type: string
    ruleId:
      type: string
    source:
      $ref: '#/NetworkHandoffSource'
    requestHeaders:
      type: string
    bodyState:
      type: string

NetworkHandoffList:
  type: object
  required: [handoffs]
  properties:
    handoffs:
      type: array
      items:
        $ref: '#/NetworkHandoffSummary'

NetworkHandoffDetail:
  type: object
  required: [handoff]
  properties:
    handoff:
      $ref: '#/NetworkHandoffView'

NetworkRule:
  type: object
  required:
    [
      id,
      scope,
      enabled,
      state,
      currentRevision,
      createdAt,
      updatedAt,
    ]
  properties:
    id:
      type: string
    name:
      type: string
    action:
      $ref: '#/NetworkRuleAction'
    matcher:
      $ref: '#/NetworkMatcher'
    scope:
      type: string
    scopeTab:
      type: integer
    enabled:
      type: boolean
    state:
      type: string
    stateReason:
      type: string
    authorClient:
      type: string
    currentRevision:
      type: integer
    hitCount:
      type: integer
    responseStatus:
      type: integer
    method:
      type: string
    pathname:
      type: string
    origin:
      type: string
    ignoreKeys:
      type: array
      items:
        type: string
    strictQuery:
      type: boolean
    lastHit:
      $ref: '#/NetworkHit'
    createdAt:
      type: integer
    updatedAt:
      type: integer
NetworkRuleDetail:
  type: object
  required: [rule, revision]
  properties:
    rule:
      $ref: '#/NetworkRule'
    revision:
      $ref: '#/NetworkRuleRevision'
    hits:
      type: array
      items:
        $ref: '#/NetworkHit'
    sample:
      $ref: '#/NetworkSampleInfo'

NetworkMatcher:
  type: object
  required: [method, queryPolicy, bodyFields, matcherVersion]
  properties:
    method:
      type: string
    origin:
      type: string
    pathname:
      type: string
    exactUrl:
      type: string
    sampleQuery:
      type: array
      items:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: string
    queryPolicy:
      $ref: '#/NetworkQueryPolicy'
    bodyFields:
      type: array
      items:
        $ref: '#/NetworkMatcherBodyField'
    resourceType:
      type: string
    matcherVersion:
      type: integer

NetworkQueryPolicy:
  type: object
  required: [mode, ignoreKeys]
  properties:
    mode:
      type: string
      enum: [lenient, strict]
    ignoreKeys:
      type: array
      items:
        type: string

NetworkMatcherBodyField:
  type: object
  required: [pointer]
  properties:
    pointer:
      type: string
    equals:
      type: string

NetworkStaticAction:
  type: object
  required: [kind, status, headers, delayMs, body]
  properties:
    kind:
      type: string
      enum: [static]
    status:
      type: integer
    headers:
      type: object
      description: |-
        Header overrides keyed by lower-cased name. Each value is a string, an
        array of strings (several set-cookie lines), or null to delete every
        header with that name.
      additionalProperties: true
    delayMs:
      type: integer
    body:
      $ref: '#/NetworkBodyPreview'

NetworkProcessorAction:
  type: object
  required: [kind, script, timeoutMs]
  properties:
    kind:
      type: string
      enum: [processor]
    script:
      type: string
    timeoutMs:
      type: integer

NetworkRuleRevision:
  type: object
  required: [revision, matcher, action, source]
  properties:
    revision:
      type: integer
    createdAt:
      type: integer
    matcher:
      $ref: '#/NetworkMatcher'
    action:
      $ref: '#/NetworkRuleAction'
    source:
      $ref: '#/NetworkRevisionSource'

NetworkRuleRevisionList:
  type: object
  required: [revisions]
  properties:
    revisions:
      type: array
      items:
        $ref: '#/NetworkRuleRevision'

NetworkRuleTestResult:
  type: object
  required: [matched, considered, samples]
  properties:
    matched:
      type: integer
    considered:
      type: integer
    samples:
      type: array
      items:
        $ref: '#/NetworkTestSample'

NetworkRuleAction:
  type: object
  required: [kind]
  properties:
    kind:
      type: string
      enum: [static, processor]
    status:
      type: integer
    headers:
      type: object
      description: |-
        Header overrides keyed by lower-cased name. Each value is a string, an
        array of strings (several set-cookie lines), or null to delete every
        header with that name.
      additionalProperties: true
    delayMs:
      type: integer
    script:
      type: string
    timeoutMs:
      type: integer
    body:
      $ref: '#/NetworkBodyPreview'

NetworkBodyPreview:
  type: object
  properties:
    bytes:
      type: integer
    encoding:
      type: string
      enum: [utf8, binary]
    preview:
      type: string

NetworkSampleInfo:
  type: object
  required: [available]
  properties:
    available:
      type: boolean
    status:
      type: integer
    bytes:
      type: integer

NetworkRevisionSource:
  type: object
  properties:
    handoffId:
      type: string
    recordId:
      type: string
    tabId:
      type: integer

NetworkTestSample:
  type: object
  required: [recordId, method, url]
  properties:
    recordId:
      type: string
    method:
      type: string
    url:
      type: string
    status:
      type: integer
    tabTitle:
      type: string
    at:
      type: integer

NetworkProcessorTestResult:
  type: object
  required: [outcome]
  properties:
    outcome:
      type: string
      enum: [processed, passthrough, error, timeout]
    status:
      type: integer
    headers:
      $ref: '#/NetworkHeaderList'
    body:
      $ref: '#/NetworkBodyPreview'
    logs:
      type: array
      items:
        type: string
    elapsedMs:
      type: integer
    error:
      type: string

NetworkRuleList:
  type: object
  required: [rules]
  properties:
    rules:
      type: array
      items:
        $ref: '#/NetworkRule'

NetworkRulePatch:
  description: Exactly one of the four groups may be present.
  type: object
  properties:
    enabled:
      type: boolean
    scope:
      type: string
      enum: [all_tabs, tab]
    tabId:
      type: integer
    name:
      type: string

NetworkRuleUpdated:
  type: object
  required: [rule]
  properties:
    rule:
      $ref: '#/NetworkRule'

NetworkRulesDeleted:
  type: object
  required: [deleted]
  properties:
    deleted:
      type: integer

NetworkRestoreRequest:
  type: object
  required: [undoToken]
  properties:
    undoToken:
      type: string

NetworkRestoreResult:
  type: object
  required: [restored]
  properties:
    restored:
      type: boolean
    recordId:
      type: string
    ruleId:
      type: string
    state:
      type: string

NetworkDeleted:
  type: object
  required: [deleted]
  properties:
    deleted:
      type: boolean
    undoToken:
      type: string
    undoUntil:
      type: integer

NetworkHitsDeleted:
  type: object
  required: [deleted]
  properties:
    deleted:
      type: integer

NetworkRecordsCleared:
  type: object
  required: [deleted, all]
  properties:
    deleted:
      type: integer
    all:
      type: boolean

NetworkStopAllResult:
  type: object
  required: [disabled, narrowed]
  properties:
    disabled:
      type: integer
    narrowed:
      type: boolean

NetworkHit:
  type: object
  required: [id, ruleId, revision, at, url, method, outcome]
  properties:
    id:
      type: string
    ruleId:
      type: string
    revision:
      type: integer
    at:
      type: integer
    tabTitle:
      type: string
    url:
      type: string
    method:
      type: string
    outcome:
      type: string
    reason:
      type: string
    networkId:
      type: string

NetworkHitList:
  type: object
  required: [hits]
  properties:
    hits:
      type: array
      items:
        $ref: '#/NetworkHit'
NetworkNearMiss:
  type: object
  required: [reason]
  properties:
    reason:
      type: string
    recordId:
      type: string
    method:
      type: string
    url:
      type: string
    tabTitle:
      type: string
    queryDiffs:
      type: array
      items:
        $ref: '#/NetworkQueryDiff'
    blockedBy:
      type: string
      enum: [cors]
NetworkHandoffSource:
  type: object
  required: [recordId, method, url]
  properties:
    recordId:
      type: string
    method:
      type: string
    url:
      type: string
    status:
      type: integer
    tabId:
      type: integer
    tabTitle:
      type: string
    resourceType:
      type: string

NetworkHandoffView:
  type: object
  required: [id, createdAt, expiresAt, bodyState]
  properties:
    id:
      type: string
    createdAt:
      type: integer
    expiresAt:
      type: integer
    ruleId:
      type: string
    source:
      $ref: '#/NetworkHandoffSource'
    requestHeaders:
      $ref: '#/NetworkHeaderList'
    requestBody:
      type: string
    responseHeaders:
      $ref: '#/NetworkHeaderList'
    bodyState:
      type: string

NetworkHeaderList:
  type: array
  items:
    $ref: '#/NetworkHeaderPair'

NetworkQueryDiff:
  type: object
  required: [key]
  properties:
    key:
      type: string
    sample:
      type: array
      items:
        type: string
    actual:
      type: array
      items:
        type: string
